<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ベトナム語">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>ベトナム語カード</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: #fff;
      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .screen {
      display: none;
      min-height: calc(100svh - 48px);
    }

    .screen.active {
      display: flex;
    }

    #homeScreen {
      flex-direction: column;
      justify-content: center;
      width: min(100%, 720px);
      margin: 0 auto;
      gap: 18px;
    }

    .menu-button {
      width: 100%;
      min-height: 92px;
      border: 0;
      border-radius: 18px;
      background: #111;
      color: #fff;
      padding: 18px;
      font-size: clamp(1.25rem, 5vw, 2rem);
      font-weight: 750;
    }

    .menu-button:active,
    .action-button:active,
    .back-button:active {
      transform: scale(0.98);
    }

    .phrase-screen {
      position: relative;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: min(100%, 900px);
      margin: 0 auto;
      text-align: center;
    }

    .phrase {
      margin: 0;
      padding: 20px 0;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: 1.08;
      font-weight: 850;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }

    .actions {
      width: min(100%, 420px);
      margin-top: 40px;
      display: grid;
      gap: 14px;
    }

    .action-button {
      min-height: 64px;
      border: 0;
      border-radius: 16px;
      background: #111;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 750;
    }

    .back-button {
      min-height: 56px;
      border: 2px solid #111;
      border-radius: 16px;
      background: #fff;
      color: #111;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .status {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: #555;
    }
  </style>
</head>

<body>
  <main>
    <section id="homeScreen" class="screen active" aria-label="メニュー">
      <button class="menu-button" data-target="cilantroScreen">
        パクチーなし
      </button>

      <button class="menu-button" data-target="notSpicyScreen">
        辛くしないでください
      </button>

      <button class="menu-button" data-target="takeawayScreen">
        お持ち帰りできますか？
      </button>

      <button class="menu-button" data-target="cardScreen">
        カード使えますか？
      </button>
    </section>

    <section id="cilantroScreen" class="screen phrase-screen">
      <p id="cilantroPhrase" class="phrase" lang="vi">
        Vui lòng không thêm ngò.
      </p>

      <div class="actions">
        <button class="action-button copy-button" type="button" data-copy-text="Vui lòng không thêm ngò." data-status-target="cilantroCopyStatus">
          コピー
        </button>
        <button class="back-button" type="button">
          戻る
        </button>
      </div>

      <p id="cilantroCopyStatus" class="status" aria-live="polite"></p>
    </section>

    <section id="notSpicyScreen" class="screen phrase-screen">
      <p id="notSpicyPhrase" class="phrase" lang="vi">
        Vui lòng không làm cay.
      </p>

      <div class="actions">
        <button class="action-button copy-button" type="button" data-copy-text="Vui lòng không làm cay." data-status-target="notSpicyCopyStatus">
          コピー
        </button>
        <button class="back-button" type="button">
          戻る
        </button>
      </div>

      <p id="notSpicyCopyStatus" class="status" aria-live="polite"></p>
    </section>

    <section id="takeawayScreen" class="screen phrase-screen">
      <p class="phrase" lang="vi">
        Có thể mang về được không?
      </p>

      <div class="actions">
        <button class="back-button" type="button">
          戻る
        </button>
      </div>
    </section>

    <section id="cardScreen" class="screen phrase-screen">
      <p class="phrase" lang="vi">
        Có thể thanh toán bằng thẻ không?
      </p>

      <div class="actions">
        <button class="back-button" type="button">
          戻る
        </button>
      </div>
    </section>
  </main>

  <script>
    const screens = document.querySelectorAll(".screen");
    const statuses = document.querySelectorAll(".status");

    function showScreen(screenId) {
      screens.forEach((screen) => {
        screen.classList.toggle("active", screen.id === screenId);
      });

      statuses.forEach((status) => {
        status.textContent = "";
      });
      window.scrollTo(0, 0);
    }

    document.querySelectorAll(".menu-button").forEach((button) => {
      button.addEventListener("click", () => {
        showScreen(button.dataset.target);
      });
    });

    document.querySelectorAll(".back-button").forEach((button) => {
      button.addEventListener("click", () => {
        showScreen("homeScreen");
      });
    });

    async function copyText(text, statusElement) {
      try {
        await navigator.clipboard.writeText(text);
        statusElement.textContent = "コピーしました";
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        statusElement.textContent = "コピーしました";
      }
    }

    document.querySelectorAll(".copy-button").forEach((button) => {
      button.addEventListener("click", () => {
        copyText(button.dataset.copyText, document.getElementById(button.dataset.statusTarget));
      });
    });

    document.getElementById("cilantroPhrase").addEventListener("click", () => {
      copyText("Vui lòng không thêm ngò.", document.getElementById("cilantroCopyStatus"));
    });

    document.getElementById("notSpicyPhrase").addEventListener("click", () => {
      copyText("Vui lòng không làm cay.", document.getElementById("notSpicyCopyStatus"));
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
